<!-- CONTEÚDO -->
<div class="container py-4">

  <h2 class="mb-4">
    <i class="bi bi-truck me-2 text-primary"></i>
    Inserir Fornecedor
  </h2>

  <form id="formFornecedor">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      

      <div class="col-md-6">
        <label class="form-label">NIF</label>
        <input type="text" class="form-control" id="nif">
      </div>

      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email">
      </div>

      <div class="col-md-6">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" id="telefone">
      </div>

      <div class="col-md-6">
        <label class="form-label">Código Postal</label>
        <input type="text" class="form-control" id="codPostal">
      </div>

      <div class="col-md-6">
        <label class="form-label">Morada</label>
        <input type="text" class="form-control" id="morada">
      </div>

      <div class="col-md-6">
  <label class="form-label">Tipo de Fornecedor</label>
  <select class="form-select" id="tipo">
    <option>Fabricante</option>
    <option>Distribuidor</option>
    <option>Assistência Técnica</option>
    <option>Consumíveis</option>
  </select>
</div>

      <div class="col-12">
        <label class="form-label">Observações</label>
        <textarea class="form-control" rows="3" id="obs"></textarea>
      </div>

    </div>

    <!-- BOTÕES -->
    <div class="mt-4 d-flex justify-content-between">

      <a href="fornecedores.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Inserir Fornecedor
      </button>

    </div>

  </form>

</div>

<!-- MODAL SUCESSO -->
<div class="modal fade" id="modalSucesso" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-success">
          <i class="bi bi-check-circle me-2"></i>
          Sucesso
        </h5>
      </div>

      <div class="modal-body">
        Fornecedor inserido com sucesso!<br><br>
        Deseja inserir outro fornecedor?
      </div>

      <div class="modal-footer">

        <button class="btn btn-outline-secondary" id="btnIrLista">
          Não, voltar à lista
        </button>

        <button class="btn btn-primary" id="btnNovoFornecedor">
          Sim, inserir outro
        </button>

      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("formFornecedor").addEventListener("submit", function(e) {
  e.preventDefault();

  let modal = new bootstrap.Modal(document.getElementById('modalSucesso'));
  modal.show();
});


// 👉 IR PARA LISTA
document.getElementById("btnIrLista").addEventListener("click", function() {
  window.location.href = "fornecedores.html";
});


// 👉 INSERIR OUTRO
document.getElementById("btnNovoFornecedor").addEventListener("click", function() {

  // limpa formulário
  document.getElementById("formFornecedor").reset();

  // fecha modal
  bootstrap.Modal.getInstance(document.getElementById("modalSucesso")).hide();

});
</script>

</body>
