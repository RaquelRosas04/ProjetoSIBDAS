    </a>

  </div>

  <!-- FILTROS -->
  <div class="card p-3 mb-4 shadow-sm">

    <div class="row g-2 align-items-center">

      <div class="col-md-3">
        <input type="text" id="fEdificio" class="form-control" placeholder="Edifício">
      </div>

      <div class="col-md-3">
        <input type="text" id="fServico" class="form-control" placeholder="Serviço">
      </div>

      <div class="col-md-2">
        <input type="text" id="fAndar" class="form-control" placeholder="Andar">
      </div>

      <div class="col-md-2">
        <input type="text" id="fSala" class="form-control" placeholder="Sala">
      </div>

      <div class="col-md-1">
        <button class="btn btn-primary w-100" id="btnFiltrar">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <div class="col-md-1 d-grid">
      <button class="btn btn-outline-secondary" id="btnLimpar">
        Limpar
      </button>
    </div>


    </div>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">
    <table class="table table-bordered align-middle">

      <thead class="table-custom">
        <tr>
          <th>Edifício</th>
          <th>Serviço</th>
          <th>Andar</th>
          <th>Sala</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>Hospital Central</td>
          <td>Cardiologia</td>
          <td>2</td>
          <td>203</td>

          <td>
            <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
          </td>
        </tr>

      </tbody>

    </table>
  </div>

</div>

<!-- JS FILTROS -->
<script>
document.getElementById("btnFiltrar").addEventListener("click", function () {

  let edificio = document.getElementById("fEdificio").value.toLowerCase();
  let servico = document.getElementById("fServico").value.toLowerCase();
  let andar = document.getElementById("fAndar").value.toLowerCase();
  let sala = document.getElementById("fSala").value.toLowerCase();

  let linhas = document.querySelectorAll("tbody tr");

  linhas.forEach(linha => {

    let col = linha.querySelectorAll("td");

    let mostrar =
      col[0].innerText.toLowerCase().includes(edificio) &&
      col[1].innerText.toLowerCase().includes(servico) &&
      col[2].innerText.toLowerCase().includes(andar) &&
      col[3].innerText.toLowerCase().includes(sala);

    linha.style.display = mostrar ? "" : "none";
  });

});

document.getElementById("btnLimpar").addEventListener("click", function () {

  document.querySelectorAll("input").forEach(i => i.value = "");

  document.querySelectorAll("tbody tr").forEach(linha => {
    linha.style.display = "";
  });

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
