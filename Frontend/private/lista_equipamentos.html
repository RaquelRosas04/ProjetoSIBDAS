<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Lista de Equipamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/1230798.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="container py-5">

  <h2 class="mb-4">
    <i class="bi bi-calendar2-week me-2"></i>Lista de Equipamentos
  </h2>

  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-custom">
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Nº Série</th>
          <th>Localização</th>
          <th>Estado</th>
          <th>Criticidade</th>
        </tr>
      </thead>
      <tbody>

        <!-- AGENDADO -->
        <tr>
          <td>CD0034</td>
          <td>Aparelho de Sinais Vitais</td>
          <td>GE</td>
          <td>TSV</td>
          <td>1298748930WE</td>
          <td>Gabinete 3</td>
          <td>Ativo</td>
          <td>2</td>
          <td class="text-success"><i class="bi bi-check-circle"></i> Agendado</td>
          <td>Online</td>
          <td>
            <a href="editar_agendamento.html?exame=Raio-X%20ao%20Tórax" class="btn btn-sm btn-outline-primary me-2">
              <i class="bi bi-pencil"></i> Editar
            </a>
            <button class="btn btn-sm btn-outline-danger btn-cancelar">
              <i class="bi bi-x-circle"></i> Cancelar
            </button>
          </td>
        </tr>

        <!-- CANCELADO -->
        <tr>
          <td>CD0034</td>
          <td>Aparelho de Sinais Vitais</td>
          <td>GE</td>
          <td>TSV</td>
          <td>1298748930WE</td>
          <td>Gabinete 3</td>
          <td>Ativo</td>
          <td>2</td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- Script de confirmação de cancelamento-->
  <script>
    document.querySelectorAll('.btn-cancelar').forEach(btn => {
      btn.addEventListener('click', function () {
        const confirmar = confirm("Tem a certeza que pretende abater o equipamento?");
        if (confirmar) {
          const row = this.closest('tr');
          row.remove();
        }
      });
    });
  </script>

</body>
</html>
