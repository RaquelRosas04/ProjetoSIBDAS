<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Detalhes do Equipamento</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="../css/1230798.css">

  <style>
    .nav-tabs .nav-link { font-weight: 500; }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="../assets/images/logo.png"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>


      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto">

          <li class="nav-item">
            <a class="nav-link active" href="detalhes_equipamento.html">Detalhes equipamentos</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="lista_equipamentos.html" data-bs-toggle="dropdown">
              Lista de Equipamentos
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Inserir equipamento</a></li>
              <li><a class="dropdown-item" href="editar_equipamento.html">Editar equipamento</a></li>
            </ul>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="fornecedores.html">Fornecedores</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="localizacaoes.html">Localizações</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="dashboard.html">Dashboard</a>
          </li>



        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
  <!-- Título -->
  <h2 class="mb-4">
    <i class="bi bi-cpu me-2 text-primary"></i>
    Detalhes do Equipamento
  </h2>

  <!-- Pesquisa -->
  <form id="formPesquisaEquipamento" class="row g-3 mb-4">
    <div class="col-md-8">
      <input type="text" id="inputBuscaCodigo" class="form-control" placeholder="Introduza o Código do Equipamento">
    </div>
    <div class="col-md-4">
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-search me-1"></i> Pesquisar
      </button>
    </div>
  </form>

  <!-- RESULTADO -->
  <div id="resultadoEquipamento" style="display: none;">

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#dadosEquipamento">
          Dados Equipamento
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#anexosEquipamento">
          Anexos
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- TAB 1 -->
      <div class="tab-pane fade show active" id="dadosEquipamento">

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Nome:</label>
            <p id="txtNome">–</p>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Marca:</label>
            <p id="txtMarca">–</p>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Modelo:</label>
            <p id="txtModelo">–</p>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Nº Série:</label>
            <p id="txtNSerie">–</p>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Localização:</label>
            <p id="txtLocalizacao">–</p>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Estado:</label>
            <p id="txtEstado">–</p>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Criticidade:</label>
            <p id="txtCriticidade">–</p>
          </div>
        </div>


        <a href="editar_equipamento.html" class="btn btn-primary mb-4">
          <i class="bi bi-pencil"></i> Editar Dados
        </a>

      </div>

      <!-- TAB 2 -->
      <div class="tab-pane fade" id="anexosEquipamento">

        <h5 class="mt-3">Documentos</h5>

        <div class="table-responsive">
          <table class="table table-bordered table-sm">
            <thead class="table-custom">
              <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Manual Técnico</td>
                <td>PDF</td>
                <td><button class="btn btn-sm btn-outline-primary">Ver</button></td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/1230798.js"></script>

  </div>


  <div class="modal fade" id="modalErro" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Erro
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Equipamento não encontrado.
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
          OK
        </button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
