<div class="container py-5" style="padding-top: 100px;">

  <!-- TÍTULO -->
  <h2 class="mb-4">
    <i class="bi bi-plus-circle me-2 text-primary"></i>
    Inserir Equipamento
  </h2>

  <!-- FORM -->
  <div class="card p-4 shadow-sm">

    <form>

  <!--  DADOS DO EQUIPAMENTO -->
  <h5 class="mb-3 text-primary">Dados do Equipamento</h5>

  <div class="row g-3 mb-4">

    <div class="col-md-6">
      <label class="form-label">Descrição</label>
      <input type="text" class="form-control" required>
    </div>

    <div class="col-md-3">
      <label class="form-label">Tipo</label>
      <select class="form-select">
        <option>Selecionar...</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Marca</label>
      <select class="form-select">
        <option>Selecionar...</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Modelo</label>
      <input type="text" class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Criticidade</label>
      <select class="form-select">
        <option>Baixo</option>
        <option>Médio</option>
        <option>Alto</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Componente</label>
      <input type="text" class="form-control">
    </div>

  </div>

  <!-- DADOS DA UNIDADE -->
  <h5 class="mb-3 text-primary">Dados da Unidade</h5>

  <div class="row g-3">

    <div class="col-md-4">
      <label class="form-label">Nº Série</label>
      <input type="text" class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Fornecedor</label>
      <select class="form-select">
        <option>Selecionar...</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Localização</label>
      <select class="form-select">
        <option>Selecionar...</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Estado</label>
      <select class="form-select">
        <option>Ativo</option>
        <option>Inativo</option>
        <option>Manutenção</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Ano Fabrico</label>
      <input type="number" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label">Data Aquisição</label>
      <input type="date" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label">Data Fim Garantia</label>
      <input type="date" class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Tipo de Entrada</label>
      <select class="form-select">
        <option>Compra</option>
        <option>Doação</option>
        <option>Aluguer</option>
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Observações</label>
      <textarea class="form-control" rows="3"></textarea>
    </div>

  </div>

  <!-- BOTÕES -->
  <div class="mt-4 d-flex justify-content-end gap-2">

    <a href="lista_equipamentos.html" class="btn btn-outline-secondary">
      Cancelar
    </a>

    <button class="btn btn-primary">
      <i class="bi bi-check"></i> Guardar
    </button>

  </div>

</form>

  </div>

</div>
