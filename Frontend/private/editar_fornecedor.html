<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Editar Fornecedor</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/1230798.css">
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg shadow-sm custom-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center">
      <img src="../assets/images/logo.png" height="40" class="me-2 logo-nav">
      <span class="fw-bold">MedEquip</span>
    </a>
  </div>
</nav>

<!-- CONTEÚDO -->
<div class="container py-5" style="max-width: 900px;">

  <h2 class="mb-4">
    <i class="bi bi-pencil-square me-2 text-primary"></i>
    Editar Fornecedor
  </h2>

  <form id="formEditarFornecedor">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" value="MedTech">
      </div>

      <div class="col-md-6">
        <label class="form-label">NIF</label>
        <input type="text" class="form-control" id="nif" value="123456789">
      </div>

      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" value="geral@medtech.pt">
      </div>

      <div class="col-md-6">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" id="telefone" value="912345678">
      </div>

      <div class="col-md-6">
        <label class="form-label">Código Postal</label>
        <input type="text" class="form-control" id="codPostal" value="1000-200">
      </div>

      <div class="col-md-6">
        <label class="form-label">Morada</label>
        <input type="text" class="form-control" id="morada" value="Lisboa">
      </div>

      <div class="col-12">
        <label class="form-label">Observações</label>
        <textarea class="form-control" rows="3" id="obs">Fornecedor principal</textarea>
      </div>

    </div>

    <!-- BOTÕES -->
    <div class="mt-4 d-flex justify-content-between">

      <a href="fornecedores.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check2-square me-1"></i>
        Guardar Alterações
      </button>

    </div>

  </form>

</div>

<!-- MODAL SUCESSO -->
<div class="modal fade" id="modalSucesso" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-success">
          <i class="bi bi-check-circle me-2"></i>
          Sucesso
        </h5>
      </div>

      <div class="modal-body">
        Alterações guardadas com sucesso!
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" id="btnVoltarLista">
          OK
        </button>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("formEditarFornecedor").addEventListener("submit", function(e) {
  e.preventDefault();

  let modal = new bootstrap.Modal(document.getElementById('modalSucesso'));
  modal.show();
});

document.getElementById("btnVoltarLista").addEventListener("click", function() {
  window.location.href = "fornecedores.html";
});
</script>

</body>
</html>
